      var tr = build(ROOTS[i]); if (i > 0 && ROOTS[i] !== 'SB') tr.style.marginTop = '22px'; stage.appendChild(tr);
    }
  }
  function apply() { stage.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.k + ')'; }
  function clampK(k) { return Math.min(maxK, Math.max(minK, k)); }
  function zoomAt(cx, cy, nk) {
    nk = clampK(nk); var r = nk / st.k;
    st.x = cx - (cx - st.x) * r; st.y = cy - (cy - st.y) * r; st.k = nk; apply();
  }
  function fit() {
    var w = stage.offsetWidth, h = stage.offsetHeight, vw = view.clientWidth, vh = view.clientHeight - 60;
    var k = clampK(Math.min(1, vw / w, vh / h));
    st.k = k; st.x = vw - w * k; st.y = 60 + Math.max(0, (vh - h * k) / 2); apply();
  }
  function toggle(id) {
    if (!(K[id] && K[id].length)) return;
    var before = stage.querySelector('[data-id="' + id + '"]').getBoundingClientRect();
    open[id] = !open[id];
    render();
    var after = stage.querySelector('[data-id="' + id + '"]').getBoundingClientRect();
    st.x += before.left - after.left; st.y += before.top - after.top; apply();
  }
  function setAll(v) {
    open = {};
    if (v) { for (var id in K) open[id] = true; } else { open.Root = true; open.SB = true; open.X1 = true; open.X2 = true; }
    render(); fit();
  }

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  function pts() { return Object.keys(ptrs).map(function (i) { return ptrs[i]; }); }

  view.addEventListener('pointerdown', function (e) {
    var box = e.target.closest ? e.target.closest('.box') : null;
    if (!Object.keys(ptrs).length) down = { id: box ? box.getAttribute('data-id') : null, x: e.clientX, y: e.clientY, moved: false };
    else if (down) down.moved = true;
    view.setPointerCapture(e.pointerId);
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var p = pts();
    last = p.length === 2 ? { d: dist(p[0], p[1]), c: mid(p[0], p[1]) } : { c: p[0] };
  });
  view.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
    var p = pts();
    if (p.length >= 2) {
      var d = dist(p[0], p[1]), c = mid(p[0], p[1]);
      if (last && last.d) { st.x += c.x - last.c.x; st.y += c.y - last.c.y; zoomAt(c.x, c.y, st.k * d / last.d); }
      last = { d: d, c: c };
    } else if (last && last.c && down && down.moved) {
      st.x += p[0].x - last.c.x; st.y += p[0].y - last.c.y; apply(); last = { c: p[0] };
    }
  });
  function up(e) {
    var wasOne = Object.keys(ptrs).length === 1;
    delete ptrs[e.pointerId];
    var p = pts();
    last = p.length === 1 ? { c: p[0] } : null;
    if (wasOne && down && !down.moved && down.id && e.type === 'pointerup') toggle(down.id);
    if (!p.length) down = null;
  }
  view.addEventListener('pointerup', up);
  view.addEventListener('pointercancel', up);
  view.addEventListener('wheel', function (e) {
    e.preventDefault(); zoomAt(e.clientX, e.clientY, st.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
  }, { passive: false });

  function center() { return { x: view.clientWidth / 2, y: view.clientHeight / 2 }; }
  document.getElementById('zin').onclick = function () { var c = center(); zoomAt(c.x, c.y, st.k * 1.4); };
  document.getElementById('zout').onclick = function () { var c = center(); zoomAt(c.x, c.y, st.k / 1.4); };
  
  document.getElementById('all').onclick = function () { setAll(true); };
  document.getElementById('none').onclick = function () { setAll(false); };

  render(); fit();
})();
</script>
</body>
</html>
